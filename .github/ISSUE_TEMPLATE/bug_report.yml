name: Bug report
description: Something broke or degraded incorrectly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks — include OS and how to reproduce. Never paste secrets or `data/` contents.
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "v0.2.1 or commit hash"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. … 2. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted)
      description: Paste relevant log lines only — strip keys and personal facts.
