[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxoryl"
version = "0.2.1"
description = "VOXORYL — local-first voice operating executive"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Vishal Gaur", email = "vishalgaur2002@gmail.com" }]
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "httpx==0.28.1",
  "pydantic==2.11.3",
  "pydantic-settings==2.9.1",
  "apscheduler==3.11.0",
  "python-dotenv==1.1.0",
  "aiofiles==24.1.0",
  "edge-tts>=7.2.8",
  "Pillow==11.2.1",
  "pyautogui==0.9.54",
  "pyperclip==1.9.0",
  "duckduckgo-search==8.0.2",
  "numpy==2.2.5",
  "mido==1.3.3",
  "python-multipart==0.0.20",
  "onnx-asr[cpu,hub]>=0.7.0",
  "onnxruntime>=1.20.0",
  "huggingface-hub>=0.30.0",
  "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/vishalgaur1/VOXORYL"
Issues = "https://github.com/vishalgaur1/VOXORYL/issues"

[tool.setuptools.packages.find]
include = ["voxoryl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
